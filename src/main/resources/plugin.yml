name: LatinosMC
version: '${project.version}'
main: com.latinosmc.plugin.LatinosMcPlugin
api-version: '1.21'
description: Entrega recompensas de los votos recibidos en LatinosMC.
author: LatinosMC
website: https://latinosmc.com

commands:
  votar:
    description: Genera tu enlace personal para votar por el servidor.
    usage: /votar
    aliases: [votelmc, votarlmc]
  vote:
    description: Genera tu enlace personal para votar por el servidor.
    usage: /vote
  lmcreload:
    description: Recarga las recompensas y los mensajes de config.yml.
    usage: /lmcreload
    aliases: [latinosmcreload, lmcrecargar]
    permission: latinosmc.reload

# A diferencia de /votar, este SI lleva permiso y por defecto es de operador:
# relee un archivo del disco y cambia que comandos ejecuta el servidor al
# entregar una recompensa. No es cosa de jugadores.
permissions:
  latinosmc.reload:
    description: Permite usar /lmcreload.
    default: op

# folia-supported: false
# Se declara explicitamente cuando se pruebe en Folia. Marcarlo sin probarlo
# provocaria corrupcion de estado en servidores con hilos por region.
